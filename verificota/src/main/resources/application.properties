spring.application.name=verificota

server.port=8082

# Direccion del microservicio consulta
clientes.consultita.url=${CONSULTITA_URL:http://localhost:8081}

# Tiempos maximos en milisegundos
spring.cloud.openfeign.client.config.consultita.connectTimeout=3000
spring.cloud.openfeign.client.config.consultita.readTimeout=5000
